<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#18191c">
<title>B 站集锦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300aeec'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="appWrap">
<!-- 分享兜底：系统没把链接传过来时（折叠屏外屏分享实测会遇到）显示，
     让用户直接粘贴 BV/短链，而不是对着空白页发呆 -->
<div id="shareFallback" hidden>
  <div class="sf-card">
    <div class="sf-title">没能从分享里读到 B 站链接</div>
    <div class="sf-sub" id="sfRaw"></div>
    <div class="sf-row">
      <input id="sfInput" type="text" placeholder="粘贴 BV 号 / b23.tv 短链 / bilibili 链接" spellcheck="false">
      <button class="sf-go" id="sfGo">解析</button>
    </div>
    <button class="sf-close" id="sfClose">关闭</button>
  </div>
</div>

<main id="app" class="app">

  <!-- ===================== 主列：播放器 + 一条控制条 ===================== -->
  <section class="col-main">

    <!-- 播放器（16:9） -->
    <div class="player-wrap">
      <div class="player" id="stage">
        <!-- 右上角轻按钮：只在需要时才占画面，且都是半透明小图标 -->
        <div class="ov-btns" id="ovBtns">
          <button class="ov-btn" id="btnList" title="片段 / 时间戳">☰</button>
          <button class="ov-btn" id="btnSet" title="设置">⚙</button>
        </div>
        <!-- 全屏叠层按钮（仅全屏显示） -->
        <button class="fs-btn" id="fsExit" title="退出全屏">✕</button>
        <button class="fs-btn" id="fsLock" title="锁定">🔒</button>
        <button class="fs-btn" id="fsKeep" title="常显：控制条不再自动隐藏">📍</button>
        <!-- 常驻细进度条：控制条淡出后仍能看出播到哪里（不参与自动隐藏） -->
        <div id="fsBar"><div id="fsBarFill"></div></div>
        <!-- 中心播放/暂停闪现 -->
        <div class="center-play" id="centerPlay">▶</div>
        <!-- 拖动进度预览 -->
        <div class="seek-preview" id="seekPreview">↔ 0:00</div>

        <div class="veil" id="veil">
          <div class="veil-spin"></div>
          <div class="veil-text" id="veilText">准备中…</div>
        </div>
        <div class="placeholder" id="placeholder">
          <div class="ph-icon">📺</div>
          <p class="ph-title">还没有视频</p>
          <p class="ph-sub">从 B 站 App / 浏览器分享视频到这里，或到「⚙ 设置」里加载测试视频</p>
        </div>
        <div class="err-layer" id="errLayer" hidden>
          <div class="err-icon">⚠</div>
          <div class="err-text" id="errText"></div>
          <button class="err-retry" id="errRetry">重新解析</button>
        </div>
      </div>
    </div>

    <!-- 控制条：播放按钮 + 时间轴合并成一条（原来是两个卡片，占掉大量纵向空间） -->
    <div class="ctrl-card" id="ctrlCard">
      <div class="ctrl-row">
        <button class="ibtn" id="btnPrev" title="上一段" disabled>⏮</button>
        <button class="ibtn play" id="btnToggle" title="播放/暂停" disabled>▶</button>
        <button class="ibtn" id="btnNext" title="下一段" disabled>⏭</button>

        <!-- 时间轴：分段块 + 已播进度 + 游标，点击跳段 -->
        <div class="trk" id="ribbon">
          <div class="trk-fill" id="trackFill"></div>
          <div class="cursor"></div>
        </div>

        <span class="tcode" id="nowseg">--:--</span>
        <button class="ibtn" id="btnFull" title="全屏">⛶</button>
      </div>
    </div>

    <!-- 标题 + 元信息（单行，能被折叠，默认只占一行） -->
    <div class="meta-card" id="metaCard" hidden>
      <h1 class="vtitle" id="vtitle">—</h1>
      <div class="meta-row">
        <span class="meta-up" id="vowner">—</span>
        <span class="dot-sep">·</span>
        <span class="meta-chip" id="vdur">—</span>
        <span class="dot-sep">·</span>
        <span class="meta-chip" id="vqn">—</span>
        <span class="dot-sep">·</span>
        <span class="meta-chip" id="vsrc">—</span>
        <span class="dot-sep">·</span>
        <span class="net-dot" id="netDot"></span>
        <span class="net-text" id="netText">本地服务</span>
      </div>
      <div class="auto-status" id="autoStatus" hidden></div>
      <div class="resume" id="resume" hidden>
        <span id="resumeText"></span>
        <button class="mini-btn" id="resumeGo">继续播放</button>
        <button class="mini-btn ghost" id="resumeReset">从头</button>
      </div>
    </div>

  </section>

  <!-- ===================== 侧栏：片段列表 + 评论时间戳（合并，默认隐藏） ===================== -->
  <aside class="col-side" id="side" hidden>
    <div class="side-head">
      <div class="side-tabs" id="sideTabs">
        <button class="stab on" data-tab="segs">片段 <span class="muted" id="listStat">—</span></button>
        <button class="stab" data-tab="text">时间戳 <span class="muted" id="replyStat">尚未解析</span></button>
      </div>
      <button class="side-close" id="sideClose" title="收起">✕</button>
    </div>

    <div class="side-body">
      <div class="pane on" id="paneSegs">
        <div class="seg-list" id="segList"><p class="empty">解析后显示片段</p></div>
      </div>
      <div class="pane" id="paneText">
        <div class="card-actions">
          <button class="mini-btn" id="btnFetchReplies">从评论自动加载</button>
          <button class="mini-btn ghost" id="btnDemo">示例</button>
          <button class="mini-btn ghost" id="btnClear">清空</button>
        </div>
        <textarea id="text" spellcheck="false" placeholder="0:04:02 17s M dr m&#10;0:04:40 15s M c&#10;…每行一条：时间戳 + 时长 + 备注（可不写时长）"></textarea>
        <div class="parse-info" id="parseInfo">等待视频解析…</div>
      </div>
    </div>
  </aside>

</main>
</div><!-- /appWrap -->

<!-- 浮窗模式下的遮罩（点它收起侧栏） -->
<div class="side-mask" id="sideMask" hidden></div>

<!-- ===================== 二级设置（补时/循环/倍速/音量等低频项都收在这里） ===================== -->
<div id="settings" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <span>设置</span>
      <button class="sheet-close" id="setClose">✕</button>
    </div>

    <div class="set-sec">播放</div>
    <div class="set-row">
      <span>循环</span>
      <select id="loop">
        <option value="all" selected>整集</option>
        <option value="one">单段</option>
        <option value="off">单次</option>
      </select>
    </div>
    <div class="set-row">
      <span>倍速</span>
      <select id="rate">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div class="set-row">
      <span>音量</span>
      <input id="vol" type="range" min="0" max="1" step="0.02" value="1">
      <button class="ibtn sm" id="btnMute" title="静音">🔊</button>
    </div>

    <div class="set-sec">补时</div>
    <div class="set-row">
      <span>前补</span>
      <select id="padFront">
        <option value="0">不补</option>
        <option value="0.5">0.5s</option>
        <option value="1" selected>1s</option>
        <option value="1.5">1.5s</option>
        <option value="2">2s</option>
      </select>
    </div>
    <div class="set-row">
      <span>后补</span>
      <select id="padBack">
        <option value="0">不补</option>
        <option value="1">1s</option>
        <option value="2" selected>2s</option>
        <option value="3">3s</option>
      </select>
    </div>
    <p class="hint">评论时间戳只精确到秒，前后各补一点兜住动作起手/收尾。</p>

    <div class="set-sec">界面</div>
    <div class="set-row">
      <span>片段面板</span>
      <select id="sideMode">
        <option value="inline" selected>内嵌（排在视频下方）</option>
        <option value="float">右侧浮窗（覆盖画面）</option>
      </select>
    </div>

    <div class="set-sec">调试</div>
    <button class="primary-btn" id="btnTestVideo">▶ 加载测试视频</button>
    <p class="hint">没有 B 站链接时，用它端到端验证集锦播放链路。</p>

    <div class="set-sec">关于</div>
    <div class="set-row">
      <span>当前版本</span>
      <span id="curVer">检测中…</span>
    </div>
    <button class="primary-btn" id="btnCheckUpdate">检查更新</button>
    <div id="updateStatus" class="set-status">点击「检查更新」从 GitHub 获取最新版本</div>
    <progress id="updateProgress" value="0" max="100" hidden></progress>
    <div class="set-row" id="updateActions" hidden>
      <button class="primary-btn" id="btnDoUpdate">下载并安装</button>
    </div>
    <p class="hint" id="updateNotes"></p>
  </div>
</div>

<!-- 底部状态条（合并了原顶栏的服务状态，只留一行小字） -->
<div class="statusbar">
  <span id="statLeft" class="dot ok">就绪</span>
  <span id="statRight" class="muted"></span>
</div>

<script src="/app.js"></script>
</body>
</html>
